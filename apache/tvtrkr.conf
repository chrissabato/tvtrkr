<VirtualHost *:8090>
    ServerName tvtrkr.local
    DocumentRoot /claude/tvtrkr/public

    <Directory /claude/tvtrkr/public>
        Options FollowSymLinks
        AllowOverride None
        Require all granted

        RewriteEngine On

        # Route /api/* requests to the PHP front controller. api/index.php
        # reads $_SERVER['REQUEST_URI'] itself, so the original URI is
        # preserved regardless of this internal rewrite.
        RewriteCond %{REQUEST_FILENAME} !-f
        RewriteRule ^api/ api/index.php [L]

        # SPA fallback: any other non-file, non-directory request falls
        # back to index.html (the app does hash-based client-side routing).
        RewriteCond %{REQUEST_FILENAME} !-f
        RewriteCond %{REQUEST_FILENAME} !-d
        RewriteRule ^ index.html [L]
    </Directory>

    ErrorLog ${APACHE_LOG_DIR}/tvtrkr-error.log
    CustomLog ${APACHE_LOG_DIR}/tvtrkr-access.log combined
</VirtualHost>
