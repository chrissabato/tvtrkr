name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # config.local.php is gitignored (holds secrets), so it's generated
      # fresh on every deploy from GitHub Actions secrets and synced along
      # with the rest of the app.
      - name: Render config.local.php from secrets
        env:
          TMDB_TOKEN: ${{ secrets.TMDB_TOKEN }}
          GOOGLE_CLIENT_ID: ${{ secrets.GOOGLE_CLIENT_ID }}
          GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
          APP_BASE_URL: ${{ secrets.APP_BASE_URL }}
          ADMIN_EMAIL: ${{ secrets.ADMIN_EMAIL }}
          MAILGUN_API_KEY: ${{ secrets.MAILGUN_API_KEY }}
          MAILGUN_DOMAIN: ${{ secrets.MAILGUN_DOMAIN }}
          MAIL_FROM: ${{ secrets.MAIL_FROM }}
        run: |
          php -r '
            $config = [
                "tmdb_token" => getenv("TMDB_TOKEN"),
                "google_client_id" => getenv("GOOGLE_CLIENT_ID"),
                "google_client_secret" => getenv("GOOGLE_CLIENT_SECRET"),
                "app_base_url" => getenv("APP_BASE_URL"),
                "admin_email" => getenv("ADMIN_EMAIL"),
                "mailgun_api_key" => getenv("MAILGUN_API_KEY"),
                "mailgun_domain" => getenv("MAILGUN_DOMAIN"),
                "mail_from" => getenv("MAIL_FROM"),
            ];
            file_put_contents(
                "public/api/config.local.php",
                "<?php\nreturn " . var_export($config, true) . ";\n"
            );
          '

      - name: Set up SSH
        env:
          SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
          SSH_HOST: ${{ secrets.SSH_HOST }}
        run: |
          mkdir -p ~/.ssh
          printf '%s\n' "$SSH_PRIVATE_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -H "$SSH_HOST" >> ~/.ssh/known_hosts 2>/dev/null

      # DEPLOY_PATH is the site's docroot (.../html) and receives the
      # contents of public/ directly. data/ (the SQLite database) lives one
      # level up, as a sibling of html/ — matching db.php's relative path —
      # and is never touched by rsync, so it survives every deploy.
      - name: Sync app files to server
        env:
          SSH_USER: ${{ secrets.SSH_USER }}
          SSH_HOST: ${{ secrets.SSH_HOST }}
          DEPLOY_PATH: ${{ secrets.DEPLOY_PATH }}
        run: |
          SITE_ROOT=$(dirname "$DEPLOY_PATH")
          ssh -i ~/.ssh/deploy_key "$SSH_USER@$SSH_HOST" "mkdir -p '$DEPLOY_PATH' '$SITE_ROOT/data'"
          rsync -az --delete \
            -e "ssh -i ~/.ssh/deploy_key -o StrictHostKeyChecking=yes" \
            ./public/ "$SSH_USER@$SSH_HOST:$DEPLOY_PATH/"
